# ---------- Spark chung ----------
spark.master                                   local[2]
spark.sql.sources.partitionOverwriteMode       dynamic
spark.sql.session.timeZone                     Asia/Ho_Chi_Minh
spark.ui.showConsoleProgress                   false
# Client DQ (Deequ) dùng chung cho job Python (gọi qua py4j) và job Scala
spark.jars                                     /opt/dq/jars/dq-platform.jar

# ---------- Data quality (namespace spark.dq.*, job đọc qua spark.conf.get) ----------
# Endpoint của DQ service (control plane). Trên K8s: http://dq-service.<ns>.svc.cluster.local:8000
spark.dq.service.url                           http://dq-service:8000
spark.dq.service.timeout.sec                   10
# enforce = FAIL thì không publish + job exit != 0 (chặn task downstream trong Airflow)
# monitor = chỉ ghi kết quả + alert, vẫn publish (dùng khi mới bật rule, chưa tin ngưỡng)
spark.dq.mode                                  enforce
# Nếu DQ service sập: true = fail job (fail-closed, an toàn), false = bỏ qua DQ và chạy tiếp (fail-open)
spark.dq.fail.on.service.error                 true
# Vị trí lưu dữ liệu (job Scala ghi vào thư mục con *_scala riêng)
spark.dq.quarantine.path                       /data/lake/quarantine
spark.dq.staging.path                          /data/lake/_staging
